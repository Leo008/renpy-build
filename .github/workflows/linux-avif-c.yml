                            with p.open('rb') as stream:bundle.addfile(info,stream)
                    sealed=temp/'private-diagnostics.cms'
                    argv=['openssl','cms','-encrypt','-binary','-aes-256-gcm','-in',str(plain),'-out',str(sealed),'-outform','DER','-recip','tools/j9-diagnostics-recipient.pem','-keyopt','rsa_padding_mode:oaep','-keyopt','rsa_oaep_md:sha256','-keyopt','rsa_mgf1_md:sha256']
