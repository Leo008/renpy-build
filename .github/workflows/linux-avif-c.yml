    - name: always精确清理本轮C1、SDK缓存和有所有权临时根
      if: always()
      shell: bash
      run: |
        /usr/bin/python3.10 -B - <<'PYCODE'
        import hashlib,json,os,re,shutil,stat,subprocess
        from pathlib import Path
        base=Path(os.environ['RUNNER_TEMP']);evidence=base/'reko-j11-avif-evidence';private=evidence/'private-diagnostics';public=base/'reko-j11-avif-public'
        expected_tool={'bytes':87970,'sha256':'87c61b193a394a9189afb70fcbd43c1cee90eae0c1a23cb55b1f16a132a706ed'}
        closed=False;inputs_removed=False;errors=[]
        def read(path,maximum=1024**2):
            """只读取本job私有根内有界普通原件。"""
            if not path.is_absolute() or any(p.is_symlink() for p in (path,*path.parents)) or not path.is_file() or path.stat().st_size>maximum:raise RuntimeError('清理证据路径/类型/大小异常')
            return json.loads(path.read_bytes())
        def command(argv):
            """精确id命令必须正常返回，不把Docker查询错误当作已消失。"""
            result=subprocess.run(argv,capture_output=True,timeout=60 if argv[1:3]==['rm','--force'] else 15)
            if result.returncode:raise RuntimeError('精确C1清理命令失败')
            return result.stdout
        try:
            owner_path=private/'container-ownership.json';owner=None
            plan=read(Path('tools/linux-avif-c-ci-plan.json').absolute())
            if owner_path.exists():
                owner=read(owner_path)
                if owner['controller']!=expected_tool or owner['run_id']!=os.environ['GITHUB_RUN_ID'] or owner['attempt']!=int(os.environ['GITHUB_RUN_ATTEMPT']) or not re.fullmatch('[0-9a-f]{64}',owner['ticket_sha256']):raise RuntimeError('本job原C1所有权不匹配')
            else:
                commands=private/'container/commands';starts=list(commands.glob('*-producer-container-start.stdout'));inspects=list(commands.glob('*-producer-container-inspect.stdout'))
                if starts or inspects:
                    if len(starts)!=1 or len(inspects)!=1 or starts[0].is_symlink() or starts[0].stat().st_size>1024:raise RuntimeError('原C0所有权证据不完整')
                    states=read(inspects[0]);cid=starts[0].read_text().strip()
                    if len(states)!=1 or states[0]['Id']!=cid:raise RuntimeError('原C0 start/inspect不同')
                    owner={'id':cid,'name':states[0]['Name'].removeprefix('/'),'image_id':states[0]['Image']}
            if owner is not None:
                if not re.fullmatch('[0-9a-f]{64}',owner['id']) or not re.fullmatch('reko-preflight-[0-9a-f]{32}',owner['name']) or owner['image_id']!=plan['C1_image_ids'][os.environ['UBUNTU_GROUP']]:raise RuntimeError('精确C1 id/name/image不同')
                named=command(['docker','ps','-aq','--no-trunc','--filter','name=^/'+owner['name']+'$']).decode().split()
                if named not in ([],[owner['id']]):raise RuntimeError('本轮C1名称已被另一id替换，不扩大删除')
                ids=command(['docker','ps','-aq','--no-trunc','--filter','id='+owner['id']]).decode().split()
                if ids not in ([],[owner['id']]):raise RuntimeError('精确id查询异常')
                if ids:
                    states=json.loads(command(['docker','inspect',owner['id']]))
                    if len(states)!=1 or states[0]['Id']!=owner['id'] or states[0]['Image']!=owner['image_id']:raise RuntimeError('精确id/image变更')
                    command(['docker','rm','--force',owner['id']])
                if command(['docker','ps','-aq','--no-trunc','--filter','id='+owner['id']]).strip():raise RuntimeError('本轮精确C1仍存在')
                closed=True
        except Exception as error:errors.append(type(error).__name__)
        try:
            path=private/'input-ownership.json'
            if path.exists():
                item=read(path);root=Path(item['path'])
                if item['controller']!=expected_tool or root.parent!=base or not root.name.startswith('reko-j11-avif-inputs-') or any(p.is_symlink() for p in (root,*root.parents)) or not re.fullmatch('[0-9a-f]{64}',item['ticket_sha256']):raise RuntimeError('本job临时输入所有权异常')
                if owner_path.exists() and (item['ticket_sha256']!=owner['ticket_sha256'] or item['parent_pid']!=owner['parent_pid']):raise RuntimeError('C1与临时输入不同父票据')
                if root.exists():
                    info=root.lstat()
                    if not stat.S_ISDIR(info.st_mode) or {'device':info.st_dev,'inode':info.st_ino}!=item['identity']:raise RuntimeError('本轮临时输入inode变更')
                    shutil.rmtree(root)
                inputs_removed=True
        except Exception as error:errors.append(type(error).__name__)
        finally:
            for name in ('reko-j11-avif-inputs-cache','reko-j11-avif-apt-inputs','reko-j11-avif-control'):
                p=base/name
                if p.exists():
                    if p.is_symlink() or not p.is_dir():errors.append('UnexpectedInputType');continue
                    shutil.rmtree(p)
            p=base/'reko-j11-avif-H1-artifact.zip'
            if p.exists():
                if p.is_symlink() or not p.is_file():errors.append('UnexpectedZIPType')
                else:p.unlink()
            summary=public/'public-summary.json'
            if summary.is_file() and not summary.is_symlink():
                row=json.loads(summary.read_bytes());row['workflow_container_cleanup_verified']=closed;row['workflow_temporary_inputs_removed']=inputs_removed;row['workflow_cleanup_errors']=errors
                summary.write_text(json.dumps(row,ensure_ascii=False,indent=2)+'\n')
            sealed=public/'private-diagnostics.cms';manifest=public/'private-diagnostics-identity.json'
            if evidence.exists():
                if evidence.is_symlink() or not evidence.is_dir():raise RuntimeError('私有证据清理根异常')
                if sealed.is_file() and not sealed.is_symlink() and manifest.is_file() and not manifest.is_symlink():
                    expected=read(manifest,32*1024**2)['ciphertext'];digest=hashlib.sha256()
                    with sealed.open('rb') as stream:
