            private.mkdir(mode=0o700,parents=True,exist_ok=True);shutil.copyfile(summary,private/'controller-summary-original.json')
        if not (public/'public-summary.json').is_file():
            (public/'workflow-status.json').write_text(json.dumps({'actual_same_C1_C_NASM_AVIF_verified':False,'result':'failed_before_filtered_summary','job_status':'${{ job.status }}'},indent=2)+'\n')
        if not private.exists():
            print('[RenPyAVIFCI] 尚无worker私有输出；此前失败不计AVIF通过',flush=True)
        else:
            try:
                if private.is_symlink() or not private.is_dir():raise RuntimeError('私有诊断根异常')
                with tempfile.TemporaryDirectory(prefix='reko-j11-avif-seal-',dir=base) as directory:
                    temp=Path(directory);temp.chmod(0o700);plain=temp/'private-diagnostics.tar.gz';members=[];total=0
                    with tarfile.open(plain,'w:gz',format=tarfile.PAX_FORMAT) as bundle:
                        for p in sorted(private.rglob('*')):
                            mode=p.lstat().st_mode
                            if stat.S_ISDIR(mode):continue
                            if not stat.S_ISREG(mode):raise RuntimeError('私有诊断存在非普通原件')
                            name=p.relative_to(private).as_posix()
                            if name.startswith('/') or any(x in ('','.','..') for x in name.split('/')):raise RuntimeError('私有诊断路径异常')
