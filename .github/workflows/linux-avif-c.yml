name: RenPy first tuple original NASM AVIF C
'on':
  push:
    branches:
    - codex/ios-locked-inputs-20261102
    paths:
    - .github/workflows/linux-avif-c.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: renpy-linux-avif-c-${{ github.ref }}
  cancel-in-progress: false
jobs:
  avif-C:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Leo008/renpy-build'
    name: Original NASM AVIF C 8.5.3 sim-arm64 Ubuntu 24.04
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      UBUNTU_GROUP: '24.04'
      TARGET_RELEASE: 8.5.3
      TARGET_ARCH: sim-arm64
      REKO_SOURCE_COMMIT: ce638e8979ed34bd61bc3532a6e704d642884b68
      RUNTIME_NAME: j11-avif-runtime-addon-20261104-02.tar.gz
      RUNTIME_BYTES: '203456'
      RUNTIME_SHA256: 7c858b01c4003c2d9ba9d0265fd821884eeee4a5f8237d9307b444d4c3736852
      RUNTIME_ASSET_ID: '706653203'
    steps:
    - name: 记录真实job开始和六小时UTC截止时间
      shell: bash
      run: |
        python3 -B - <<'PYCODE'
        import datetime,json,os,shutil,subprocess,time
        cli=shutil.which('gh')
        if not cli:raise SystemExit('[RenPyAVIFCI] 缺少GitHub CLI，不能确认真实job起点')
        endpoint='repos/Leo008/renpy-build/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/attempts/'+os.environ['GITHUB_RUN_ATTEMPT']+'/jobs?per_page=100'
        result=subprocess.run([cli,'api',endpoint],capture_output=True,timeout=60)
        if result.returncode:raise SystemExit('[RenPyAVIFCI] 真实job API不可用')
        name='Original NASM AVIF C 8.5.3 sim-arm64 Ubuntu 24.04'
        rows=[row for row in json.loads(result.stdout)['jobs'] if row['name']==name and row['status']=='in_progress']
        if len(rows)!=1 or not rows[0].get('started_at'):raise SystemExit('[RenPyAVIFCI] 未唯一确认实际运行job，不以当前时间补默认值')
        started=int(datetime.datetime.fromisoformat(rows[0]['started_at'].replace('Z','+00:00')).timestamp())
        if not 0<=time.time()-started<21600:raise SystemExit('[RenPyAVIFCI] 实际job UTC起点异常')
        with open(os.environ['GITHUB_ENV'],'a') as stream:
            stream.write('REKO_JOB_STARTED_UTC='+str(started)+'\n')
            stream.write('REKO_JOB_DEADLINE_UTC='+str(started+21600)+'\n')
        PYCODE
      env:
        GH_TOKEN: ${{ github.token }}
    - name: 检出固定19工具依赖和已有公开CMS证书
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
        fetch-depth: 1
        sparse-checkout: |
          tools/ci_linux_target_python_prefix.py
          tools/ci_linux_image_c_tasks.py
          tools/ci_linux_avif_c_tasks.py
          tools/linux-avif-c-ci-plan.json
          tools/linux-image-c-ci-plan.json
          tools/linux-target-python-prefix-ci-plan.json
          tools/run_locked_target_python_tasks.py
          tools/ci_linux_target_python_replay.py
          tools/linux-target-python-replay-ci-plan.json
          tools/inventory_source_inputs.py
          tools/ci_linux_host_python_bootstrap.py
          tools/linux-host-python-bootstrap-ci-plan.json
          tools/run_locked_host_python_tasks.py
          tools/host-python-bootstrap-plan.json
          tools/ci_linux_host_replay.py
          tools/run_linux_python_replay.py
          tools/python-linux-host-replay-plan.json
          tools/j9-diagnostics-recipient.pem
          prebuilt/clang_rt.tar.gz
        sparse-checkout-cone-mode: false
    - name: 核固定19原件、单tuple与远端18GiB入口
      shell: bash
      run: |
        /usr/bin/python3.10 -B - <<'PYCODE'
        import hashlib,json,os,platform,shutil,sys
        from pathlib import Path
        if sys.version_info[:2]!=(3,10) or platform.system()!='Linux' or platform.machine()!='x86_64':raise SystemExit('[RenPyAVIFCI] 需要Linux amd64 Python3.10')
        expected={'tools/ci_linux_target_python_prefix.py': '49b7f7c63d604bb0855ccb2125811989b6915230f148142fbce97b8a33784da5', 'tools/linux-target-python-prefix-ci-plan.json': 'd70d6eafcc42eb9460942f140bdc9b89126635a2fea847040c88c139d5263eeb', 'tools/run_locked_target_python_tasks.py': '2f78625d419d9900f169b5f674cd5925f158f0cc62c11e0add20fded9cdffa4a', 'tools/ci_linux_target_python_replay.py': '0595595d50855c3d73679b35456804abf84099b63fbfb1772f099fb03c6ad5b4', 'tools/linux-target-python-replay-ci-plan.json': 'a5b75b33514cf5778f9eda2b1d4f55edd6b6736d885e5e53c961c6b63810a9fb', 'tools/inventory_source_inputs.py': '2ee4d817243d10dc900bb0834757b80bcafbb64ea066b860ff26be1d3794f824', 'tools/ci_linux_host_python_bootstrap.py': '1c21119694f417c159fcc0bab744e257e5a9f548bac17952b92eca4bfa34e2a7', 'tools/linux-host-python-bootstrap-ci-plan.json': 'd686fd2ed862ac13af9ab51de11ad80e232b331b1ebff0c5ce880c09cefa98e2', 'tools/run_locked_host_python_tasks.py': '5abab3ec944e368cfe3b84126ec56bb78dfed3a653eac9659efc9e8a6afd329c', 'tools/host-python-bootstrap-plan.json': '9e07264629245df5ab2692485b6342222cf458cdcab3f31b802e80bf895e5a32', 'tools/ci_linux_host_replay.py': 'bbc38bcbf2cb192d8f0f760d7d5b927df40eda112c28098b84fa884d8b85b011', 'tools/run_linux_python_replay.py': '7946c3eb9271263473aecf02ba7dcf48ffc24bd4a2e889cb5185921eb61ddddc', 'tools/python-linux-host-replay-plan.json': 'd7b7288a524ad73cd645c20ba7342586bb00da6a837f43d34a5894496005178d', 'tools/j9-diagnostics-recipient.pem': 'db7c3cb23532bf02e51e24ae085fa14049658833469479b75981a1cd574f94f8', 'prebuilt/clang_rt.tar.gz': 'c2c69498077f9e29a6299952be1b11bc02c2d05f3a9174c863a41d87bfbc8c0c', 'tools/ci_linux_image_c_tasks.py': '29ada979f9bf8b50af8026f83928cfdab5ce65233e185d07dc174f5b018cd8d1', 'tools/linux-image-c-ci-plan.json': 'd6e0b42a54eeff66023080bdd5516c8d372bd7a05d95ea26e0a3446428a59d33', 'tools/ci_linux_avif_c_tasks.py': '87c61b193a394a9189afb70fcbd43c1cee90eae0c1a23cb55b1f16a132a706ed', 'tools/linux-avif-c-ci-plan.json': '7446f064fffa951647dcd5bb0636c955f4aebfbc971181de493f8ab175a03cf2'}
        for name,sha in expected.items():
            p=Path(name)
            if p.is_symlink() or not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=sha:raise SystemExit('[RenPyAVIFCI] 固定原件不同：'+name)
        plan=json.loads(Path('tools/linux-avif-c-ci-plan.json').read_bytes());dplan=json.loads(Path('tools/linux-target-python-prefix-ci-plan.json').read_bytes())
        group,release,arch=(os.environ[k] for k in ('UBUNTU_GROUP','TARGET_RELEASE','TARGET_ARCH'))
        if (group,release,arch)!=('24.04','8.5.3','sim-arm64') or release not in plan['groups'][group]:raise SystemExit('[RenPyAVIFCI] 单tuple/group组合错误')
        producer=dplan['producer_profiles'][group]['artifact']
        with open(os.environ['GITHUB_ENV'],'a') as stream:
            for key,value in {'H1_ARTIFACT_ID':producer['id'],'H1_ARTIFACT_BYTES':producer['bytes'],'H1_ARTIFACT_SHA256':producer['sha256'],'H1_RUN_ID':producer['run_id']}.items():stream.write(str(key)+'='+str(value)+'\n')
        base=Path(os.environ['RUNNER_TEMP']);control=base/'reko-j11-avif-control';control.mkdir(mode=0o700)
        free=shutil.disk_usage(base).free
        (control/'storage-before.json').write_text(json.dumps({'free_bytes':free,'estimated_work_bytes':16*1024**3,'reserve_bytes':2*1024**3,'minimum_entry_free_bytes':18*1024**3,'measurement':'point_in_time_free_space','peak_measured':False},indent=2)+'\n')
        if free<18*1024**3:raise SystemExit('[RenPyAVIFCI] 远端18GiB入口不足；16+2GiB为估算而非实测峰值')
        (control/'deployment-identity.json').write_text(json.dumps({'source_commit':os.environ['REKO_SOURCE_COMMIT'],'controller_sha256':expected['tools/ci_linux_avif_c_tasks.py'],'plan_sha256':expected['tools/linux-avif-c-ci-plan.json'],'checked_original_count':len(expected),'job_started_utc':int(os.environ['REKO_JOB_STARTED_UTC']),'job_deadline_utc':int(os.environ['REKO_JOB_DEADLINE_UTC'])},indent=2)+'\n')
        print('[RenPyAVIFCI] 固定19原件、单tuple与远端18GiB入口通过',flush=True)
        PYCODE
    - name: 先实测Linux CMS加密、解密和篡改拒绝
      shell: bash
      run: |
        /usr/bin/python3.10 -B - <<'PYCODE'
        import hashlib, json, os, shutil, subprocess, tempfile
        from pathlib import Path
        public = Path(os.environ['RUNNER_TEMP'])/'reko-j11-avif-public';public.mkdir()
        def command(argv):
            """CMS自检正文只含无害固定字节，失败不披露其他输入。"""
            result = subprocess.run(argv,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=90)
            if result.returncode: raise RuntimeError('Linux CMS自检命令失败')
            return result.stdout
        with tempfile.TemporaryDirectory(prefix='reko-j11-avif-cms-selftest-',dir=os.environ['RUNNER_TEMP']) as name:
            root=Path(name);root.chmod(0o700)
            plain=root/'plain';plain.write_bytes(b'Reko J11 harmless CMS roundtrip\n')
            key=root/'key.pem';cert=root/'cert.pem';sealed=root/'sealed.cms';restored=root/'restored'
            command(['openssl','req','-new','-x509','-newkey','rsa:3072','-nodes','-keyout',str(key),'-out',str(cert),'-subj','/CN=Reko J11 Harmless CI Selftest/','-days','1','-sha256'])
            # keyopt必须在其对应recip之后；此处按真实加密命令构造相同参数。
            def seal(recipient, destination):
                """使用固定CMS算法和公证书封装无害探针。"""
                command(['openssl','cms','-encrypt','-binary','-aes-256-gcm','-in',str(plain),'-out',str(destination),'-outform','DER','-recip',str(recipient),'-keyopt','rsa_padding_mode:oaep','-keyopt','rsa_oaep_md:sha256','-keyopt','rsa_mgf1_md:sha256'])
            seal(cert,sealed)
            decrypt=['openssl','cms','-decrypt','-binary','-inform','DER','-in',str(sealed),'-recip',str(cert),'-inkey',str(key),'-out',str(restored)]
            command(decrypt)
            if restored.read_bytes()!=plain.read_bytes():raise RuntimeError('CMS还原字节不符')
            damaged=bytearray(sealed.read_bytes());damaged[-1]^=1;sealed.write_bytes(damaged);restored.unlink()
            if subprocess.run(decrypt,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=90).returncode==0:raise RuntimeError('CMS未拒绝篡改')
            if restored.exists():restored.unlink()
            seal(Path('tools/j9-diagnostics-recipient.pem'),root/'actual-recipient-probe.cms')
            report={'Linux_CMS_roundtrip':True,'tampered_ciphertext_rejected':True,'actual_recipient_encryption':True,'actual_recipient_private_key_on_CI':False,'openssl':command(['openssl','version']).decode().strip()}
            (public/'cms-selftest.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
        print('[RenPyAVIFCI] Linux CMS实际自检通过；CI仅持公开接收证书',flush=True)
        PYCODE
    - name: 取得固定完整APT分发
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        github-token: ${{ github.token }}
        run-id: 41419224335
        name: renpy-apt-inputs-${{ env.UBUNTU_GROUP }}-41419224335-1
        path: ${{ runner.temp }}/reko-j11-avif-apt-inputs
    - name: 验证原H1 ZIP与已发布十五文本实际API身份
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        /usr/bin/python3.10 -B - <<'PYCODE'
        import hashlib,json,os,shutil,stat,subprocess
        from pathlib import Path
        cli=shutil.which('gh')
        if not cli:raise SystemExit('[RenPyAVIFCI] 缺少GitHub CLI')
        base=Path(os.environ['RUNNER_TEMP']);control=base/'reko-j11-avif-control';argv=[cli,'api']
        help_result=subprocess.run(argv+['--help'],capture_output=True,timeout=30)
        if b'--allow-escape-sequences' in help_result.stdout+help_result.stderr:argv.append('--allow-escape-sequences')
        def api(endpoint,name):
            """保存原API正文为私有证据，不打印token或临时下载地址。"""
            result=subprocess.run(argv+[endpoint],capture_output=True,timeout=90)
            if result.returncode:raise SystemExit('[RenPyAVIFCI] 固定GitHub API不可用')
            (control/name).write_bytes(result.stdout);return json.loads(result.stdout)
        row={'id':int(os.environ['H1_ARTIFACT_ID']),'bytes':int(os.environ['H1_ARTIFACT_BYTES']),'sha256':os.environ['H1_ARTIFACT_SHA256']}
        route='repos/Leo008/renpy-build/actions/artifacts/'+str(row['id']);meta=api(route,'H1-artifact-api.json')
        if meta.get('id')!=row['id'] or meta.get('expired') is not False or meta.get('size_in_bytes')!=row['bytes'] or meta.get('digest')!='sha256:'+row['sha256'] or meta['workflow_run']['id']!=int(os.environ['H1_RUN_ID']):raise SystemExit('[RenPyAVIFCI] H1原artifact强身份不同')
        p=base/'reko-j11-avif-H1-artifact.zip'
        if not p.exists():
            with p.open('xb') as stream:result=subprocess.run(argv+[route+'/zip'],stdout=stream,stderr=subprocess.PIPE,timeout=600)
            if result.returncode:raise SystemExit('[RenPyAVIFCI] H1原ZIP运输失败')
        if p.is_symlink() or not stat.S_ISREG(p.lstat().st_mode):raise SystemExit('[RenPyAVIFCI] H1 ZIP类型不同')
        h=hashlib.sha256()
        with p.open('rb') as stream:
            while block:=stream.read(1048576):h.update(block)
        if p.stat().st_size!=row['bytes'] or h.hexdigest()!=row['sha256']:raise SystemExit('[RenPyAVIFCI] H1 ZIP缓存SHA不同，不覆盖或回退')
        release=api('repos/Leo008/renpy-build/releases/406525604','runtime-release-api.json')
        assets=[v for v in release['assets'] if v['name']==os.environ['RUNTIME_NAME']]
        url='https://github.com/Leo008/renpy-build/releases/download/ci-inputs-8.5.3-20261008/'+os.environ['RUNTIME_NAME']
        if release['id']!=406525604 or release['tag_name']!='ci-inputs-8.5.3-20261008' or len(assets)!=1 or assets[0]['id']!=int(os.environ['RUNTIME_ASSET_ID']) or assets[0]['size']!=int(os.environ['RUNTIME_BYTES']) or assets[0]['digest']!='sha256:'+os.environ['RUNTIME_SHA256'] or assets[0]['state']!='uploaded' or assets[0]['browser_download_url']!=url:raise SystemExit('[RenPyAVIFCI] 十五文本包实际发布身份不同')
        print('[RenPyAVIFCI] 真实H1 API/ZIP和十五文本Release资产身份通过',flush=True)
        PYCODE
    - name: 复用C03、H0和CAS缓存，核十五文本并宿主stdin解密SDK
      shell: bash
      env:
        CI_INPUTS_PASSWORD: ${{ secrets.CI_INPUTS_PASSWORD }}
        IOS_DEVICE_SDK_SHA256: ${{ secrets.IOS_DEVICE_SDK_SHA256 }}
        IOS_SIMULATOR_SDK_SHA256: ${{ secrets.IOS_SIMULATOR_SDK_SHA256 }}
      run: |
        /usr/bin/python3.10 -B - <<'PYCODE'
        import hashlib, os, subprocess, urllib.request
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'reko-j11-avif-inputs-cache';root.mkdir(mode=0o700)
        (root/'source-cache').mkdir(mode=0o700)
        password=os.environ.pop('CI_INPUTS_PASSWORD',None)
        if not password or '\n' in password or '\r' in password:raise SystemExit('[RenPyAVIFCI] 缺少有效SDK运输秘密')
        origin='https://github.com/Leo008/renpy-build/releases/download/ci-inputs-8.5.3-20261008/'
        def download(name,size,sha):
            """读取既有发布原件，先校验外部强身份，不输出临时签名地址。"""
            path=root/name
            if path.exists():
                digest=hashlib.sha256()
                with path.open('rb') as stream:
                    while block:=stream.read(1048576):digest.update(block)
                if path.is_symlink() or path.stat().st_size!=size or digest.hexdigest()!=sha:raise SystemExit('[RenPyAVIFCI] 显式输入缓存身份错误，不联网替换：'+name)
                return path
            try:
                with urllib.request.urlopen(origin+name,timeout=120) as response,path.open('xb') as stream:
                    total=0;digest=hashlib.sha256()
                    while block:=response.read(1048576):
                        total+=len(block)
                        if total>size:raise ValueError('transport size overflow')
                        digest.update(block);stream.write(block)
                if total!=size or digest.hexdigest()!=sha:raise ValueError('transport identity mismatch')
            except Exception:
                raise SystemExit('[RenPyAVIFCI] 固定发布输入运输/强身份失败：'+name) from None
            return path
        import json
        plan=json.loads(Path('tools/linux-avif-c-ci-plan.json').read_bytes())
        row=plan['C_runtime_addon'];download(row['name'],row['bytes'],row['sha256'])
        download(os.environ['RUNTIME_NAME'],int(os.environ['RUNTIME_BYTES']),os.environ['RUNTIME_SHA256'])
        download('h0-linux-host-inputs-20261102-01.tar.gz.enc',116556720,'4beeb8544d248c59f7f12216cd11a8d291d0d4edcf660eb854fbc4abcb1b34c5')
        download('h1-public-recipe-addon-20261102-01.tar.gz',264133884,'0da8d46083c0c882b1e246a5c7e3df526e20c92246c823abfe3f617271fb5ec2')
        rows=[('iPhoneOV14.0.sdk.tar.gz',27728336,'07f67d298046eaaac6f54f238de56370ca16aac0b6a2f9c19683ca7e56acd133',27728304,'2f4bb43a38dc20ec439d366449ff7933262f3767ccfe863f16c5d3a82499d287','IOS_DEVICE_SDK_SHA256'),('iPhoneSimulator14.0.sdk.tar.gz',21472384,'be1c1049401283b6fc4202c4eea6830412ca768c9f07a071734bfeac8b6f004a',21472366,'4fea56f1b4751cfe7eb4ed92416f7e6d9087375c2144c33a5e9dd332d567bba5','IOS_SIMULATOR_SDK_SHA256')]
        child_env={'PATH':'/usr/bin:/bin','LANG':'C','LC_ALL':'C'}
        help_result=subprocess.run(['openssl','enc','-help'],capture_output=True,env=child_env,timeout=30)
        for name,csize,csha,psize,psha,secret_sha in rows:
            if os.environ.pop(secret_sha,None)!=psha:raise SystemExit('[RenPyAVIFCI] SDK既有秘密SHA与固定身份不符')
            encrypted=download(name+'.enc',csize,csha);plain=root/name
            argv=['openssl','enc','-d','-aes-256-cbc','-pbkdf2','-iter','200000','-md','sha256','-in',str(encrypted),'-out',str(plain),'-pass','stdin']
            if b'-saltlen' in help_result.stdout+help_result.stderr:argv+=['-saltlen','8']
            result=subprocess.run(argv,input=(password+'\n').encode(),capture_output=True,env=child_env,timeout=180)
            if result.returncode or plain.stat().st_size!=psize or hashlib.sha256(plain.read_bytes()).hexdigest()!=psha:
                raise SystemExit('[RenPyAVIFCI] SDK明文完整身份未通过')
            plain.chmod(0o600);encrypted.unlink()
        password=None
        import tarfile,shutil
        catalog={v['path']:v for v in plan['text_runtime_catalog']};runtime=root/'text-runtime';runtime.mkdir(mode=0o700);seen=set()
        with tarfile.open(root/os.environ['RUNTIME_NAME'],'r:gz') as source:
            for item in source:
                if item.name not in catalog or item.name in seen or not item.isfile() or item.sparse or item.pax_headers or item.mode!=0o644 or item.size!=catalog[item.name]['bytes']:raise SystemExit('[RenPyAVIFCI] 十五文本包成员类型/数量/大小不同')
                seen.add(item.name);p=runtime/item.name
                with source.extractfile(item) as inp,p.open('xb') as target:shutil.copyfileobj(inp,target,262144)
                if p.stat().st_size!=catalog[item.name]['bytes'] or hashlib.sha256(p.read_bytes()).hexdigest()!=catalog[item.name]['sha256']:raise SystemExit('[RenPyAVIFCI] 十五文本成员原SHA不同')
                p.chmod(0o644)
        if seen!=set(catalog):raise SystemExit('[RenPyAVIFCI] 十五文本缺件')
        (Path(os.environ['RUNNER_TEMP'])/'reko-j11-avif-control/input-transport.json').write_text(json.dumps({'runtime_asset_id':int(os.environ['RUNTIME_ASSET_ID']),'runtime_bytes':int(os.environ['RUNTIME_BYTES']),'runtime_sha256':os.environ['RUNTIME_SHA256'],'flat_text_members':len(seen),'raw_text_bytes':sum(v['bytes'] for v in catalog.values()),'parent_TLS_mode':'urllib_default_verified_context','SDK_decrypted_only_on_host':True,'H2_or_new_J2_inputs_consumed':False},indent=2)+'\n')
        print('[RenPyAVIFCI] C03/H0/CAS/十五文本和SDK完整身份通过；密码仅宿主stdin',flush=True)
        PYCODE
    - name: 同一C1真实原C接NASM与AVIF八原Task并有界返还
      shell: bash
      env:
        REKO_H0_INPUTS_PASSWORD: ${{ secrets.REKO_H0_INPUTS_PASSWORD }}
      run: |
        control="$RUNNER_TEMP/reko-j11-avif-control"
        set +e
        /usr/bin/python3.10 -B tools/ci_linux_avif_c_tasks.py \
          --ubuntu "$UBUNTU_GROUP" --release "$TARGET_RELEASE" --arch "$TARGET_ARCH" \
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --job-deadline-utc "$REKO_JOB_DEADLINE_UTC" \
