        import hashlib,json,os,shutil,stat,subprocess,tarfile,tempfile
        from pathlib import Path
        base=Path(os.environ['RUNNER_TEMP']);public=base/'reko-j11-avif-public';public.mkdir(exist_ok=True)
        evidence=base/'reko-j11-avif-evidence';private=evidence/'private-diagnostics';summary=evidence/'public-summary.json';control=base/'reko-j11-avif-control'
